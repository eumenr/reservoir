            } else {

            }

```dataviewjs
const file = dv.current().file;
const content = await this.app.vault.read(app.vault.getAbstractFileByPath(file.path));
const lines = content.split("\n");
const file_name = file?.name;

// 解析 slide 頁碼（從 HTML 註解抓 (#/n)）
function getSlideIndex(i) {
	for (let j = i - 1; j >= 0; j--) {
		const m = lines[j].match(/\(#\/(\d+)\)/);
		if (m) return m[1];
	}
	return null;
}

// 擷取標題
const headings_reveal = [];
for (let i = 0; i < lines.length; i++) {
	const line = lines[i];
	const m = line.match(/^(#{2,4})\s+(.*)/);
	if (!m) continue;

	const level = m[1].length; // ## = 2, ### = 3, #### = 4
	const title = m[2].trim();
	const slide = getSlideIndex(i);

	if (slide) {
		headings_reveal.push({ level, title, slide });
	}
}

// 基準層級
const baseLevel = 2;

// 產生階層清單
let slide_block = "";
let reading_block = "";

for (const h of headings_reveal) {
	const indent = "  ".repeat(h.level - baseLevel);
	const link =
		h.level === 2
			? `(#/${h.slide})`
			: `(#/${h.slide}/0/0)`;
	// Slide Mode 標記，裡面是 Reveal/Slide 專用標記
	slide_block += `>> ${indent}- [${h.title}]${link}\n`;
	// Reading View 標記
	reading_block += `>> ${indent}- #${h.title}\n`;
}

// 輸出，無法顯示在reading-view，因為slide_block無法渲染
let link_block = "> [!flex] \n>> [!outline|slide-hide] " + file_name + "\n" + reading_block + ">\n>> [!outline|color-purple|reading-view-hide] " + file_name + "\n>>\n>>" + slide_block
// 輸出，可以顯示在reading-view，但slide_block要手動貼上
let code_block = "> [!flex] \n>> [!outline|slide-hide] " + file_name + "\n" + reading_block + ">\n>> [!outline|color-purple|reading-view-hide] " + file_name + "\n>>\n>> ````text\n" + slide_block + ">> ````\n";
let code_pure = `
\`\`\`\`markdown
> [!flex]
>> [!outline|slide-hide] ${file_name}
${reading_block}
> [!flex]
>> [!outline|color-purple|reading-view-hide] ${file_name}
${slide_block}
\`\`\`\`
`;

// 顯示為大綱及文字區塊
dv.paragraph(code_pure);

```

> 1. 顏淵問仁。子曰：「克己復禮為仁。一日克己復禮，天下歸仁焉。為仁由己，而由人乎哉？」顏淵曰：「請問其目。」子曰：「非禮勿視，非禮勿聽，非禮勿言，非禮勿動。」顏淵曰：「回雖不敏，請事斯語矣。」
> <!-- end::[論語.md] -->


> [!author] 論語#顏淵12.2
> 
> <!-- begin::[論語.md] -->
> 2. 仲弓問仁。子曰：「出門如見大賓，使民如承大祭。己所不欲，勿施於人。在邦無怨，在家無怨。」仲弓曰：「雍雖不敏，請事斯語矣。」
> <!-- end::[論語.md] -->


> [!author] 論語#顏淵12.3
> 
> <!-- begin::[論語.md] -->
> 3. 司馬牛問仁。子曰：「仁者其言也訒。」曰：「其言也訒，斯謂之仁已乎？」子曰：「為之難，言之得無訒乎？」
> <!-- end::[論語.md] -->


> [!author] 論語#顏淵12.15
> 
> <!-- begin::[論語.md] -->
> 15. 子曰：「君子博學於文，約之以禮，亦可以弗畔矣夫！」
> <!-- end::[論語.md] -->


> [!author] 論語#顏淵12.22
> 
> <!-- begin::[論語.md] -->
> 22. 樊遲問仁。子曰：「愛人。」問知。子曰：「知人。」樊遲未達。子曰：「舉直錯諸枉，能使枉者直。」樊遲退，見子夏。曰：「鄉也吾見於夫子而問知，子曰，『舉直錯諸枉，能使枉者直』，何謂也？」子夏曰：「富哉言乎！舜有天下，選於眾，舉皋陶，不仁者遠矣。湯有天下，選於眾，舉伊尹，不仁者遠矣。」
> <!-- end::[論語.md] -->


> [!author] 論語#憲問14.5
> 
> <!-- begin::[論語.md] -->
> 5. 南宮适問於孔子曰：「羿善射，奡盪舟，俱不得其死然；禹稷躬稼，而有天下。」夫子不答，南宮适出。子曰：「君子哉若人！尚德哉若人！」
> <!-- end::[論語.md] -->


> [!author] 論語#衛靈公15.9
> 
> <!-- begin::[論語.md] -->
> 9. 子曰：「志士仁人，無求生以害仁，有殺身以成仁。」
> <!-- end::[論語.md] -->


> [!author] 論語#衛靈公15.10
> 
> <!-- begin::[論語.md] -->
> 10. 子貢問為仁。子曰：「工欲善其事，必先利其器。居是邦也，事其大夫之賢者，友其士之仁者。」
> <!-- end::[論語.md] -->


> [!author] 論語#衛靈公15.33
> 
> <!-- begin::[論語.md] -->
> 33. 子曰：「知及之，仁不能守之；雖得之，必失之。知及之，仁能守之。不莊以涖之，則民不敬。知及之，仁能守之，莊以涖之。動之不以禮，未善也。」
> <!-- end::[論語.md] -->


> [!author] 論語#衛靈公15.35
> 
> <!-- begin::[論語.md] -->
> 35. 子曰：「民之於仁也，甚於水火。水火，吾見蹈而死者矣，未見蹈仁而死者也。」
> <!-- end::[論語.md] -->


> [!author] 論語#陽貨17.6
> 
> <!-- begin::[論語.md] -->
> 6. 子張問仁於孔子。孔子曰：「能行五者於天下，為仁矣。」請問之。曰：「恭、寬、信、敏、惠。恭則不侮，寬則得眾，信則人任焉，敏則有功，惠則足以使人。」
> <!-- end::[論語.md] -->

        function extend() {
            const target = {};
            for (let i = 0; i < arguments.length; i++) {
                const source = arguments[i];
                for (const key in source) {
                    if (source.hasOwnProperty(key)) {
                        target[key] = source[key];
                    }
                }
            }
            return target;
        }

        function isLight(color) {
            // normalize to rgb(a)
            const optionEl = document.createElement("option");
            optionEl.style.color = color;
            const normalizedColor = optionEl.style.color;

            const match = normalizedColor.match(/(\d+), (\d+), (\d+)/);
            if (!match) return false;
            const [, c_r, c_g, c_b] = match;

            const brightness = ((c_r * 299) + (c_g * 587) + (c_b * 114)) / 1000;
            return brightness > 155;
        }

        const bgColor = getComputedStyle(document.documentElement).getPropertyValue('--r-background-color').trim();

        if (isLight(bgColor)) {
            document.body.classList.add('has-light-background');
        } else {
            document.body.classList.add('has-dark-background');
        }

        // default options to init reveal.js
