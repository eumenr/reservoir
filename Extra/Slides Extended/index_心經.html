        function fitElements() {
            const itemsToFit = document.getElementsByClassName('fitText');
            for (const item in itemsToFit) {
                if (Object.hasOwnProperty.call(itemsToFit, item)) {
                    const element = itemsToFit[item];
                    fitElement(element, 1, 1000);
                    element.classList.remove('fitText');
                }
            }
        }

        function fitElement(element, start, end) {

            let size = (end + start) / 2;
            element.style.fontSize = `${size}px`;

            if (Math.abs(start - end) < 1) {
                while (element.scrollHeight > element.offsetHeight) {
                    size--;
                    element.style.fontSize = `${size}px`;
                }
                return;
            }

            if (element.scrollHeight > element.offsetHeight) {
                fitElement(element, start, size);
            } else {
                fitElement(element, size, end);
            }
        }

        document.onreadystatechange = () => {
            fitElements();
            if (document.readyState === 'complete') {
                if (pageInIframe() && window.location.href.indexOf("?export") != -1){

                        clearInterval(stateCheck);

## 經文

- 觀自在菩薩，行深般若波羅蜜多時，照見五蘊皆空，度一切苦厄。
- 舍利子！色不異空，空不異色；色即是空，空即是色，受想行識亦復如是。

- 舍利子！是諸法空相，不生不滅，不垢不淨，不增不減。
- 是故，空中無色，無受想行識；無眼耳鼻舌身意；無色聲香味觸法；無眼界，乃至無意識界；無無明，亦無無明盡，乃至無老死，亦無老死盡；無苦集滅道；**無智亦無得**。

- 三世諸佛，依般若波羅蜜多故，得阿耨多羅三藐三菩提。
- 故知：般若波羅蜜多是大神咒，是大明咒，是無上咒，是無等等咒，能除一切苦，真實不虛。
- 故說般若波羅蜜多咒，即說咒曰：揭諦揭諦，波羅揭諦，波羅僧揭諦，菩提薩婆訶。

# 課後總結

- 傳布法師 心經要解
	- 無智亦無得
	- 六度波羅蜜
	- 經者，徑也

> [!author] 天台四教儀備釋 上([X0977](https://cbetaonline.dila.edu.tw/zh/X57n0977_p0608c23?q=阿含十二方等八&l=0608c23&near_word=&kwic_around=30))
> 如來四十九年說法，總成五時。頌曰：阿含十二方等八，二十二年般若談，法華涅槃共八年，華嚴最初三七日。


<!-- begin::[U20260412_091853.md] -->
> [!author] 大般若波羅蜜多經卷第五百七十 第六分現相品第八 ([T0220](https://cbetaonline.dila.edu.tw/zh/T07n0220_p0944c04?q=牧牛女&l=0944c04&near_word=&kwic_around=30))
> 大德當知！如是菩薩方便善巧行深般若波羅蜜多，能降天魔，伏諸外道，大悲化度一切有情，既經六年從定而起，隨順世法詣無垢河，洗浴出已於河邊立。有牧牛女[](https://cbetaonline.dila.edu.tw/#n0944006)[6]搆百乳牛以飲一牛，[](https://cbetaonline.dila.edu.tw/#n0944006)[＊]搆此牛乳用作乳糜奉獻菩薩。復有六億天、龍、藥叉、健達縛等，各持種種香美飲食而來奉獻，咸作是言：『大士！正士！惟願受我飲食供養。』菩薩愍之皆悉為受。時，牧牛女、天、龍、藥叉、健達縛等互不相見，各見菩薩獨受其供。時，有無量諸天、人等，因見受供咸得悟道，是故菩薩為示現之。菩薩爾時實不洗浴，亦不受彼人、天等供。
<!-- end::[U20260412_091853.md] -->

    <script src="plugin/chart/chart.umd.js"></script>
    <script src="plugin/chart/plugin.js"></script>
    <script src="plugin/customcontrols/plugin.js"></script>


    <script>
        function extend() {
            const target = {};
            for (let i = 0; i < arguments.length; i++) {
                const source = arguments[i];
                for (const key in source) {
                    if (source.hasOwnProperty(key)) {
                        target[key] = source[key];
                    }
                }
            }
            return target;
        }

        function isLight(color) {
            // normalize to rgb(a)
            const optionEl = document.createElement("option");
            optionEl.style.color = color;
            const normalizedColor = optionEl.style.color;

            const match = normalizedColor.match(/(\d+), (\d+), (\d+)/);
            if (!match) return false;
            const [, c_r, c_g, c_b] = match;

            const brightness = ((c_r * 299) + (c_g * 587) + (c_b * 114)) / 1000;
            return brightness > 155;
        }

        const bgColor = getComputedStyle(document.documentElement).getPropertyValue('--r-background-color').trim();

        if (isLight(bgColor)) {
            document.body.classList.add('has-light-background');
        } else {
            document.body.classList.add('has-dark-background');
        }

        // default options to init reveal.js
        const defaultOptions = {
            controls: true,
            progress: true,
            history: true,
            center: true,
            transition: 'default', // none/fade/slide/convex/concave/zoom
            plugins: [
                ObsidianMarkdown,
                RevealHighlight,
                RevealZoom,
                RevealNotes,
                RevealMath.KaTeX,
                RevealMermaid,
                RevealChart,
                RevealCustomControls,
            ],
            allottedTime: "120",

            katex: {
                local: 'plugin/math/katex',
                extensions: ["mhchem"],
            },
            markdown: {
                gfm: true,
            },
            mermaid: {
                theme: isLight(bgColor) ? 'default' : 'dark',
            },
            customcontrols: {
                controls: [
                ]
            },
        };

        if ( pageInIframe() ) {
            defaultOptions.scrollActivationWidth = 5;
        }

        // options from URL query string
        const queryOptions = Reveal().getQueryHash() || {};

        const options = extend(defaultOptions, {"controls":true,"progress":true,"slideNumber":true,"center":true,"transition":"concave","transitionSpeed":"default","width":960,"height":700,"margin":0.04}, queryOptions);
    </script>

    <script>
      /**
       * KaTeX Equation Numbering Note
       *
       * KaTeX maintains a global equation counter for \begin{equation} environments.
       * When navigating between slides, reveal.js math plugin may re-render math, causing
       * equation numbers to change randomly.
       *
       * Note: Regular $$ blocks don't have equation numbers - only \begin{equation} does.
       *
       * If you experience issues with equation numbers changing:
       * Use manual \tag{} commands: \begin{equation}\tag{1} ... \end{equation}
       */

      Reveal.initialize(options);
    </script>
